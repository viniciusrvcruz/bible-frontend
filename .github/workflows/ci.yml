name: CI (Build, Typecheck and Test)

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build-typecheck-and-test:
    name: Build, Typecheck and Test
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_API_BASE_URL: ${{ secrets.NUXT_PUBLIC_API_BASE_URL }}
      NUXT_API_KEY: ${{ secrets.NUXT_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx nuxt typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
